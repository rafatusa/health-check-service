      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build image
      run: docker build -t "${{ steps.image.outputs.ref }}" .
    - name: Install Trivy
      run: "set -o pipefail\nmkdir -p \"$HOME/.local/bin\"\ncurl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh\
        \ \\\n  | sh -s -- -b \"$HOME/.local/bin\" \"$TRIVY_VERSION\"\necho \"$HOME/.local/bin\"\
        \ >> \"$GITHUB_PATH\"\n\"$HOME/.local/bin/trivy\" --version\n"
      env:
        TRIVY_VERSION: v0.74.0
    - name: Trivy image scan
      run: "trivy image \\\n  --severity HIGH,CRITICAL \\\n  --ignore-unfixed \\\n\
        \  --exit-code 1 \\\n  --format table \\\n  --no-progress \\\n  \"${{ steps.image.outputs.ref\
        \ }}\"\n"
    - name: Push image
      run: docker push "${{ steps.image.outputs.ref }}"
  provision:
