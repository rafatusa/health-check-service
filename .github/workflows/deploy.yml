        terraform_wrapper: 'false'
    - id: infra
      name: Read instance address
      run: "cd infra\nterraform init -input=false -reconfigure \\\n  -backend-config=\"\
        bucket=${{ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\necho\
        \ \"ip=$(terraform output -raw public_ip)\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "${{ steps.infra.outputs.ip }}" >> ~/.ssh/known_hosts

        '
    - name: Wait for SSH to accept connections
      run: "for i in $(seq 1 30); do\n  if ssh -i ~/.ssh/deploy_key -o BatchMode=yes\
        \ -o ConnectTimeout=10 \\\n       \"$SSH_USER@${{ steps.infra.outputs.ip }}\"\
        \ true 2>/dev/null; then\n    echo \"SSH is up after ${i} attempt(s)\"\n \
        \   exit 0\n  fi\n  echo \"SSH not ready yet (attempt ${i}/30), retrying in\
        \ 10s\"\n  sleep 10\ndone\necho \"SSH never became reachable\" >&2\nexit 1\n"
    - name: Copy Puppet manifests
      run: "ssh -i ~/.ssh/deploy_key -o BatchMode=yes \\\n  \"$SSH_USER@${{ steps.infra.outputs.ip\
        \ }}\" \\\n  'rm -rf /tmp/puppet'\nscp -i ~/.ssh/deploy_key -o BatchMode=yes\
        \ -r puppet \\\n  \"$SSH_USER@${{ steps.infra.outputs.ip }}:/tmp/puppet\"\n"
    - name: Verify the uploaded manifest is the one just checked out
      run: "LOCAL_SUM=$(sha256sum puppet/manifests/site.pp | cut -d' ' -f1)\nREMOTE_SUM=$(ssh\
        \ -i ~/.ssh/deploy_key -o BatchMode=yes \\\n  \"$SSH_USER@${{ steps.infra.outputs.ip\
        \ }}\" \\\n  'sha256sum /tmp/puppet/manifests/site.pp | cut -d\" \" -f1')\n\
        echo \"local  : $LOCAL_SUM\"\necho \"remote : $REMOTE_SUM\"\nif [ \"$LOCAL_SUM\"\
        \ != \"$REMOTE_SUM\" ]; then\n  echo \"Uploaded manifest does not match the\
        \ checked-out manifest\" >&2\n  exit 1\nfi\necho \"Manifest checksums match\"\
        \n"
    - name: Install Puppet
      run: "ssh -i ~/.ssh/deploy_key -o BatchMode=yes \\\n  \"$SSH_USER@${{ steps.infra.outputs.ip\
        \ }}\" \\\n  'set -e\n   for i in $(seq 1 5); do\n     sudo apt-get update\
        \ -y && break\n     echo \"apt-get update failed (attempt $i/5), retrying\"\
        ; sleep 15\n   done\n   sudo DEBIAN_FRONTEND=noninteractive apt-get install\
        \ -y puppet\n   puppet --version'\n"
    - name: Apply Puppet manifest
      run: "REPO_LC=$(echo \"${{ github.repository }}\" | tr '[:upper:]' '[:lower:]')\n\
        IMAGE_REF=\"ghcr.io/${REPO_LC}:${{ github.sha }}\"\n\n# The GHCR token is\
        \ piped over stdin and read into the remote env by\n# $(cat), so it never\
        \ appears in the command string or process table.\nset +e\nssh -i ~/.ssh/deploy_key\
        \ -o BatchMode=yes \\\n  \"$SSH_USER@${{ steps.infra.outputs.ip }}\" \\\n\
        \  \"FACTER_app_image='${IMAGE_REF}' FACTER_ghcr_user='${GHCR_USER}' \\\n\
        \   FACTER_ghcr_token=\\$(cat) \\\n   sudo -E puppet apply /tmp/puppet/manifests/site.pp\
        \ --detailed-exitcodes\" \\\n  <<< \"$GHCR_TOKEN\"\nrc=$?\nset -e\n\n# --detailed-exitcodes:\
        \ 0 = no change, 2 = changes applied (both OK);\n# 4 and 6 mean resource failures\
        \ and must fail the stage.\nif [ \"$rc\" -eq 0 ] || [ \"$rc\" -eq 2 ]; then\n\
        \  echo \"Puppet apply succeeded (exit ${rc})\"\n  exit 0\nfi\necho \"Puppet\
        \ apply failed with exit ${rc}\" >&2\nexit \"$rc\"\n"
      env:
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GHCR_USER: ${{ github.actor }}
  verify:
    runs-on: ubuntu-latest
    needs:
    - configure
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
