  build_push:
    runs-on: ubuntu-latest
    needs:
    - test
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - id: image
      name: Resolve lowercase image reference
      run: 'REPO_LC=$(echo "${{ github.repository }}" | tr ''[:upper:]'' ''[:lower:]'')

        echo "ref=ghcr.io/${REPO_LC}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

        '
    - name: Log in to GHCR
      run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}"
