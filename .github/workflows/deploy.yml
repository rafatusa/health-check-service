        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=$AWS_REGION\"\nIP=$(terraform\
        \ output -raw public_ip)\n\necho \"--- smoke 1/3: GET /health reports UP ---\"\
        \ncurl --fail --show-error --retry 12 --retry-delay 15 --retry-all-errors\
        \ \\\n  -o /tmp/health.json \"http://$IP/health\"\ncat /tmp/health.json\n\
        grep -q '\"status\":\"UP\"' /tmp/health.json\n\necho \"--- smoke 2/3: GET\
        \ /version reports build metadata ---\"\ncurl --fail --show-error --retry\
        \ 6 --retry-delay 10 --retry-all-errors \\\n  -o /tmp/version.json \"http://$IP/version\"\
        \ncat /tmp/version.json\ngrep -q '\"version\"' /tmp/version.json\ngrep -q\
