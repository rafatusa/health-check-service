spring.application.name=health-check-service

# Bind loopback only: nginx terminates public traffic on :80 and proxies here.
# Overridden to 0.0.0.0 inside the container (see Dockerfile), where the
# container network boundary provides the same isolation.
server.address=127.0.0.1
server.port=8080

# Build provenance surfaced by GET /version. Maven filters the project version
# at package time; APP_COMMIT is injected by the container at runtime.
app.version=@project.version@
app.commit=${APP_COMMIT:unknown}

# Do not leak stack traces to clients.
server.error.include-stacktrace=never
server.error.include-message=never
